<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMDS 結案補專案用</title>
<style>
:root{--green:#2d7a4f;--green2:#4a9e6e;--light:#e8f5ee;--border:#c8e0d2;--text:#1a2e22;--muted:#6b8f7a;--bg:#f4faf7;--white:#fff;--red:#c0392b;--shadow:0 2px 12px rgba(45,122,79,.10)}
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:'Microsoft JhengHei','微軟正黑體',sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto}h1{font-size:24px;color:var(--green);border-left:5px solid var(--green);padding-left:12px;margin:0 0 18px}
.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.title{font-size:18px;font-weight:800;color:var(--green);padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.notice{padding:12px 14px;border-radius:8px;background:#fff7e8;border:1px solid #e2b45d;color:#8a4b10;font-weight:700;line-height:1.55;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.field{flex:1;min-width:240px}.label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 10px;font:inherit;outline:none;background:#fff;color:var(--text)}input:focus,textarea:focus{border-color:var(--green2)}textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:var(--light);color:var(--green);border:1px solid var(--border)}.danger{background:#fff0ee;color:var(--red);border:1px solid #efc3bc}.small{padding:6px 10px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.count{font-size:14px;color:var(--muted);margin-bottom:8px}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px}
.project-list{display:flex;flex-direction:column;gap:8px}.project-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}.num{width:26px;height:26px;border-radius:50%;background:var(--light);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}.name{flex:1;font-weight:700;word-break:break-all}.actions{display:flex;gap:6px;flex-wrap:wrap}
.scriptbox{font-family:Consolas,monospace;font-size:12px;min-height:130px;background:#fbfdfc}.hint{font-size:13px;color:var(--muted);line-height:1.55;margin-top:8px}.status{margin-top:10px;font-size:14px;font-weight:700;color:var(--green);min-height:20px}
@media(max-width:600px){body{padding:10px}.panel{padding:14px}.project-item{align-items:flex-start}.actions{flex-direction:column}.field{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>🍃 PMDS 多專案控制版</h1>
<div class="notice">新版為真正批次加入：只開一次專案清單，一次選取所有專案，只按一次加入、一次儲存。全部成功時不顯示訊息；只有找不到或執行失敗才回報。</div>

<div class="panel">
  <div class="title">① 專案清單</div>
  <div class="row">
    <div class="field"><span class="label">新增單一專案</span><input id="newProject" type="text" placeholder="輸入完整專案名稱"></div>
    <button class="primary" id="addBtn">＋ 加入</button>
  </div>
  <div style="margin-top:14px">
    <span class="label">一次貼上多個專案（每行一個）</span>
    <textarea id="bulkInput" placeholder="115年○○專案\n115年△△專案\n115年□□專案"></textarea>
    <div class="toolbar"><button class="primary" id="bulkAddBtn">批次加入全部</button><button class="danger" id="clearBtn">清空全部</button></div>
  </div>
</div>

<div class="panel">
  <div class="title">② 已加入專案</div>
  <div class="count" id="countText">共 0 項</div>
  <div id="projectList" class="project-list"></div>
</div>

<div class="panel">
  <div class="title">③ 多專案書籤</div>
  <button class="primary" id="generateBtn">產生書籤腳本</button>
  <div class="toolbar"><button class="secondary" id="copyBtn">複製腳本</button></div>
  <textarea id="scriptOutput" class="scriptbox" readonly></textarea>
  <div class="hint">執行時會一次開啟 PMDS 專案清單，把所有找到的專案同時選取，接著只執行一次「加入」與一次「儲存」。</div>
  <div class="status" id="status"></div>
</div>
</div>
<script>
(function(){
'use strict';
var STORAGE_KEY='pmds_multi_projects_v1',projects=[],$=function(id){return document.getElementById(id)};
function norm(v){return String(v||'').trim().replace(/\s+/g,' ')}
function load(){try{projects=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!Array.isArray(projects))projects=[]}catch(e){projects=[]}projects=projects.map(norm).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i});render()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));render()}
function addNames(arr){var n=0;arr.forEach(function(v){v=norm(v);if(v&&projects.indexOf(v)<0){projects.push(v);n++}});save();return n}
function render(){var box=$('projectList');$('countText').textContent='共 '+projects.length+' 項';box.innerHTML='';if(!projects.length){box.innerHTML='<div class="empty">目前沒有專案</div>';return}projects.forEach(function(name,i){var item=document.createElement('div');item.className='project-item';var num=document.createElement('div');num.className='num';num.textContent=i+1;var nm=document.createElement('div');nm.className='name';nm.textContent=name;var acts=document.createElement('div');acts.className='actions';var edit=document.createElement('button');edit.className='secondary small';edit.textContent='編輯';edit.onclick=function(){var v=prompt('修改專案名稱：',projects[i]);if(v===null)return;v=norm(v);if(!v)return;if(projects.indexOf(v)>=0&&projects[i]!==v)return alert('此專案已存在');projects[i]=v;save()};var del=document.createElement('button');del.className='danger small';del.textContent='刪除';del.onclick=function(){projects.splice(i,1);save()};acts.append(edit,del);item.append(num,nm,acts);box.appendChild(item)})}
function buildBookmarklet(){
 if(!projects.length){alert('請先加入至少一個專案');return ''}
 var runner=function(PROJECTS){(async function(){
  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  function visible(el){return !!(el&&(el.offsetWidth||el.offsetHeight||el.getClientRects().length))}
  function trigger(el,t){try{el.dispatchEvent(new Event(t,{bubbles:true}))}catch(e){}}
  function getMenu(){return document.getElementById('ctl00_ContentPlaceHolder1_projectSearch_lstbMenu')||document.getElementById('ctl00_ContentPlaceHolder1_lstbMenu')}
  function getSearch(){var a=document.getElementById('btnSearch'),b=document.getElementById('btnPjDoSearch');return visible(a)?a:(visible(b)?b:(a||b))}
  async function waitAjax(max){max=max||8000;var s=Date.now();while(Date.now()-s<max){var busy=false;try{busy=window.Sys&&Sys.WebForms&&Sys.WebForms.PageRequestManager&&Sys.WebForms.PageRequestManager.getInstance().get_isInAsyncPostBack()}catch(e){}if(!busy)return true;await wait(120)}return false}
  async function waitMenu(max){max=max||6000;var s=Date.now();while(Date.now()-s<max){var m=getMenu();if(m&&m.options&&m.options.length)return m;await wait(150)}return null}
  function findOpt(list,name){var opts=Array.from(list.options||[]);return opts.find(function(o){return o.text.trim()===name})||opts.find(function(o){return o.text.trim().includes(name)})||null}
  try{
   var tab=document.querySelector('a[href$="#tabs2"]');if(tab){tab.click();await wait(300);await waitAjax(5000)}
   var search=getSearch();if(search){search.click();await wait(250);await waitAjax(8000)}
   var list=await waitMenu(6000);if(!list){alert('專案加入失敗：找不到專案清單');return}
   var missing=[],matched=[];
   Array.from(list.options).forEach(function(o){o.selected=false});
   PROJECTS.forEach(function(name){var opt=findOpt(list,name);if(opt){opt.selected=true;matched.push({name:name,opt:opt})}else missing.push(name)});
   if(!matched.length){alert('找不到任何專案：\n- '+missing.join('\n- '));return}
   list.multiple=true;
   trigger(list,'input');trigger(list,'change');await wait(150);
   var setBtn=document.getElementById('btnSet');if(!setBtn){alert('專案加入失敗：找不到 btnSet');return}
   setBtn.click();await wait(400);await waitAjax(8000);
   var commit=document.getElementById('btnCommit');if(!commit){alert('專案加入失敗：找不到 btnCommit');return}
   commit.click();await wait(500);await waitAjax(8000);
   if(missing.length)alert('以下專案找不到：\n- '+missing.join('\n- '));
  }catch(e){alert('專案加入失敗：'+(e.message||e))}
 })()};
 return 'javascript:('+runner.toString()+')('+JSON.stringify(projects)+');void 0;';
}
$('addBtn').onclick=function(){var n=addNames([$('newProject').value]);if(n){$('newProject').value='';$('status').textContent='已加入 1 個專案'}else $('status').textContent='未加入：空白或已存在'};
$('newProject').addEventListener('keydown',function(e){if(e.key==='Enter')$('addBtn').click()});
$('bulkAddBtn').onclick=function(){var n=addNames($('bulkInput').value.split(/\r?\n/));$('bulkInput').value='';$('status').textContent='已批次加入 '+n+' 個專案'};
$('clearBtn').onclick=function(){if(projects.length&&confirm('確定清空全部專案？')){projects=[];save();$('scriptOutput').value='';$('status').textContent='已清空'}};
$('generateBtn').onclick=function(){var c=buildBookmarklet();if(c){$('scriptOutput').value=c;$('status').textContent='已產生 '+projects.length+' 項專案的批次書籤'}};
$('copyBtn').onclick=async function(){var t=$('scriptOutput').value;if(!t){t=buildBookmarklet();$('scriptOutput').value=t}if(!t)return;try{await navigator.clipboard.writeText(t)}catch(e){$('scriptOutput').select();document.execCommand('copy')}$('status').textContent='已複製書籤腳本'};
load();
})();
</script>
</body>
</html>
